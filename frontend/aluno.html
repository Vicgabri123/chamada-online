<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamada Online - Aluno</title>
  <link rel="stylesheet" href="styleA.css">
<div class="container">
  <img src="logos/A3.gif" alt="Decoração esquerda" class="side-img">
</div>
<div class="card">
    <h2>Registro de Presença</h2>
    <div class="input-group">
      <input id="nome" type="text" placeholder="Seu nome">
      <input id="matricula" type="text" placeholder="Matrícula">
    </div>
    <button id="btn-presenca" onclick="registrarPresenca()">Enviar Presença</button>
    <input id="justificativa" type="text" placeholder="Justifique (caso o GPS falhe)" style="display:none;">
    <div id="saida"></div>

    <!-- Mensagem de confirmação -->
<div id="confirmacao" class="confirma">
  <img src="logos/A1.png" alt="Presença confirmada" class="side-img">
  <p id="mensagem-confirmacao" class="mconfirma"></p>
</div>
  </div>

  <img src="logos/A2(A).gif" alt="Decoração direita" class="side-img right">

<script>

// Detecta o domínio atual e ajusta automaticamente o backend
let API_URL;

// Se estiver rodando localmente (localhost ou 127.0.0.1), usa o backend local
if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
  API_URL = "http://localhost:3000";
} 
// Se for Tunnelmole (contém .tunnelmole.net)
else if (window.location.hostname.includes("tunnelmole.net")) {
  API_URL = `https://${window.location.hostname}`;
} 
// Se for Render ou outro domínio público, detecta automaticamente o mesmo host base
else {
  API_URL = "https://chamada-online.onrender.com"; // seu domínio fixo do backend
}

console.log("Backend conectado em:", API_URL);


async function obterLocalizacao() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) {
      reject("Seu navegador não suporta geolocalização.");
      return;
    }

    const timeout = setTimeout(() => reject("Tempo limite excedido."), 10000);

    navigator.geolocation.getCurrentPosition(
      pos => {
        clearTimeout(timeout);
        resolve(pos);
      },
      err => {
        clearTimeout(timeout);
        console.warn("Erro de alta precisão:", err);
        // tenta novamente com menor precisão
        navigator.geolocation.getCurrentPosition(
          pos2 => resolve(pos2),
          () => reject("Não foi possível obter localização. Ative o GPS e tente novamente."),
          { enableHighAccuracy: false, timeout: 8000 }
        );
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  });
}
  let tentativasFalhas = 0;
  
async function registrarPresenca() {
  const botao = document.getElementById("btnEnviar");
  botao.disabled = true;
  botao.innerText = "⏳ Enviando...";
  
  let posicao = await obterLocalizacao().catch(erro => {
    tentativasFalhas++;
    alert(erro);
    return null;
  });
  let latitude = null, longitude = null;
  if (posicao) {
    latitude = posicao.coords.latitude;
    longitude = posicao.coords.longitude;
  } else if (tentativasFalhas >= 2) {
    // Exibir campo de justificativa
    document.getElementById("justificativa").style.display = "block";
    const justificativa = prompt("Localização falhou 2 vezes. Informe o motivo:");
     const nome = document.getElementById("nome").value;
    const matricula = document.getElementById("matricula").value;

    const res = await fetch(`${API_URL}/presenca`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nome, matricula, justificativa, horario, deviceId })
    });
    const data = await res.json();
    alert(data.msg);
    botao.disabled = false;
    botao.innerText = "✅ Enviar Presença";
    return;
  } else {
    botao.disabled = false;
    botao.innerText = "✅ Enviar Presença";
    return;
  }

  // se chegou aqui, GPS funcionou
  const nome = document.getElementById("nome").value.trim();
  const matricula = document.getElementById("matricula").value.trim();
  const botao = document.getElementById("btn-presenca");

  if (!nome || !matricula) {
    alert("Preencha todos os campos!");
    return;
  }

  
  // tenta obter localização obrigatoriamente
  if (!navigator.geolocation) {
    alert("Seu navegador não suporta geolocalização!");
    return;
  }

  let latitude, longitude;

  // tenta por até 10 segundos
  const posicao = await obterLocalizacao().catch(erro => {
  alert(erro);
  return null;
  });
  
  if (!posicao) return; // interrompe se não tiver localização

  latitude = posicao.coords.latitude;
  longitude = posicao.coords.longitude;

  const horario = new Date().toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo" });

  // gera ou recupera um ID único para o dispositivo
  let deviceId = localStorage.getItem("deviceId");
  if (!deviceId) {
    deviceId = crypto.randomUUID();
    localStorage.setItem("deviceId", deviceId);
  }

  const res = await fetch(`${API_URL}/presenca`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nome, matricula, latitude, longitude, horario, deviceId })
  });

  const data = await res.json();
  const saida = document.getElementById("saida");
  saida.innerText = data.msg;

  // mostra imagem de confirmação apenas se o envio for sucesso
  if (data.msg.includes("registrado com sucesso")) {
    const confirmacao = document.getElementById("confirmacao");
    const mensagem = document.getElementById("mensagem-confirmacao");

    mensagem.textContent = `Presença anotada às ${horario} de ${nome}.`;
    confirmacao.style.display = "block";

    // efeito suave
    confirmacao.style.opacity = "1";
    setTimeout(() => {
      confirmacao.style.transition = "opacity 1s";
      confirmacao.style.opacity = "0";
      setTimeout(() => (confirmacao.style.display = "none"), 1000);
    }, 5000);
  }
}

</script>
