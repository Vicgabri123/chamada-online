<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chamada Online</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Chamada Online - Professor</h1>

 <div class="input-controls">
    <label for="limite">Número máximo de alunos:</label>
    <input type="number" id="limite" value="30" min="1" max="100">

    <label for="duracao">Duração da lista (horas):</label>
    <input type="number" id="duracao" value="24" min="1" max="72">

    
    </div>

  <div>
    <button onclick="criarLista()">Criar Lista de Chamada</button>
  </div>
  <div>
    <button onclick="fecharLista()">Fechar Lista de Chamada</button>
  </div>
  <div>
    <button onclick="verLista()">Atualizar Lista</button></div>

  

  <h2 class="AlunosPresentes">Alunos presentes:</h2>
  <!-- Loader de atualização -->
  <div id="loader">
  <img id="loader-logo" src="logos/EA1.png" alt="Carregando..." class="logo">
  <p class="AlunosPresentes">Atualizando lista...</p>
</div>

<ul id="lista-alunos" class="li"></ul>

<pre id="saida"></pre>

<div id="qrcode-container">
  <h3>QR Code de Acesso</h3>
  <img id="qrcode-img" alt="QR Code para alunos">
</div>

<button class="qRB" onclick="toggleQrCode()">Mostrar/Esconder QR Code</button>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script>
async function baixarExcel() {
  const res = await fetch(`${API_URL}/lista`);
  const data = await res.json();

  if (!data.length) {
    alert("Nenhum aluno presente ainda.");
    return;
  }

  // cria planilha
  const ws = XLSX.utils.json_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Presenças");

  // gera e baixa
  XLSX.writeFile(wb, "lista_de_presenca.xlsx");
}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
async function baixarPDF() {
  const res = await fetch(`${API_URL}/lista`);
  const data = await res.json();

  if (!data.length) {
    alert("Nenhum aluno presente ainda.");
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFontSize(14);
  doc.text("Lista de Presença", 10, 10);
  doc.setFontSize(10);

  let y = 20;
  data.forEach((a, i) => {
    const linha = `${i + 1}. ${a.nome} | Matrícula: ${a.matricula} | ${a.horario} | ${a.grupo}`;
    doc.text(linha, 10, y);
    y += 8;
  });

  doc.save("lista_de_presenca.pdf");
}</script>
<div class="export-buttons">
  <button onclick="baixarExcel()">📊 Baixar Excel</button>
  <button onclick="baixarPDF()">📄 Baixar PDF</button>
</div>
    <!-- Bibliotecas -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Config do PIN -->
  <script src="config.js"></script>

  <!-- Seu arquivo JS -->
  <script src="professor.js"></script>
</body>
</html>
